name: Links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # every Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Some sites answer 403 or 429 to any robot while working for people: accept those.
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept 200,206,403,429
            --user-agent "Mozilla/5.0 (compatible; awesome-forex link check)"
            --exclude "^https://github.com/ForexiaPro/awesome-forex"
            README.md contributing.md
          fail: ${{ github.event_name == 'pull_request' }}

      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links
          content-filepath: ./lychee/out.md
          labels: links

  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npx --yes awesome-lint
